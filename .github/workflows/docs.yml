name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build DocC site
        run: |
          swift package --allow-writing-to-directory ./docs \
            generate-documentation --target GraphKit \
            --output-path ./docs \
            --transform-for-static-hosting \
            --hosting-base-path "${{ github.event.repository.name }}"
          touch ./docs/.nojekyll
          cat > ./docs/index.html << 'EOF'
          <!doctype html><meta charset="utf-8">
          <script>location.replace(document.baseURI.slice(0, document.baseURI.lastIndexOf("/")) + "/documentation/graphkit")</script>
          <meta http-equiv="refresh" content="0;url=documentation/graphkit">
          <link rel="canonical" href="documentation/graphkit">
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
